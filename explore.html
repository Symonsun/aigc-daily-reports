<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIGC Daily · 项目情报汇总</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e6e9ef; --line2:#eef1f5;
    --fg:#1b2330; --fg2:#3c4658; --muted:#7a8699;
    --accent:#2563eb; --accent-soft:#eaf1ff; --new:#0e9f6e; --new-soft:#e7f7f0;
    --star:#b8860b;
    --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.6;
       -webkit-font-smoothing:antialiased;}

  header{max-width:1180px; margin:0 auto; padding:32px 22px 4px;}
  h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-.3px;}
  h1 .dot{color:var(--accent);}
  .sub{color:var(--muted); font-size:14px; margin-top:6px;}
  .sub a{color:var(--accent); text-decoration:none; font-weight:600;}
  .sub a:hover{text-decoration:underline;}

  .wrap{max-width:1180px; margin:0 auto; padding:14px 22px 70px;}

  .controls{display:flex; flex-wrap:wrap; gap:16px 20px; align-items:flex-start;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    position:sticky; top:12px; z-index:20; box-shadow:0 1px 3px rgba(20,30,50,.04), 0 8px 24px rgba(20,30,50,.05);}
  .group{display:flex; flex-direction:column; gap:7px;}
  .lbl{font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase;}
  select,input[type=search]{background:#fff; color:var(--fg); border:1px solid var(--line);
    border-radius:9px; padding:8px 11px; font-family:var(--font); font-size:14px; outline:none;
    transition:border-color .15s, box-shadow .15s;}
  select:focus,input[type=search]:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  input[type=search]{min-width:240px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; max-width:620px;}
  .chip{cursor:pointer; user-select:none; font-size:13px; font-weight:500;
    background:#f3f5f8; border:1px solid var(--line); color:var(--fg2);
    border-radius:999px; padding:5px 13px; transition:all .13s;}
  .chip:hover{border-color:#c7d0dd;}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  .bar{display:flex; align-items:center; justify-content:space-between; margin:20px 2px 12px;}
  .count{color:var(--muted); font-size:14px;}
  .count b{color:var(--fg); font-weight:700;}
  .reset{cursor:pointer; font-size:13px; font-weight:600; color:var(--accent);
    background:none; border:none; padding:4px 6px;}
  .reset:hover{text-decoration:underline;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px;}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    transition:transform .14s, box-shadow .14s, border-color .14s;}
  .item:hover{transform:translateY(-2px); border-color:#d3dceb;
    box-shadow:0 6px 22px rgba(20,30,50,.09);}
  .item h3{margin:0 0 8px; font-size:16px; font-weight:700; line-height:1.35; word-break:break-word;}
  .item h3 a{color:var(--fg); text-decoration:none;}
  .item h3 a:hover{color:var(--accent);}
  .meta{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 9px;}
  .tag{font-size:12px; font-weight:500; color:var(--fg2);
    background:#f4f6f9; border:1px solid var(--line2); border-radius:7px; padding:2px 9px;}
  .tag.cat{color:var(--accent); background:var(--accent-soft); border-color:#d6e4ff;}
  .tag.star{color:var(--star);}
  .tag.new{color:#fff; background:var(--new); border-color:var(--new); font-weight:700;}
  .desc{color:var(--fg2); font-size:14px; line-height:1.6;}
  .desc .en{display:block; color:var(--muted); font-size:12.5px; margin-top:4px;}
  .empty{color:var(--muted); text-align:center; padding:60px 0;}

  @media (max-width:560px){ h1{font-size:22px;} .controls{top:0;} }
  @media (prefers-reduced-motion: reduce){ .item{transition:none;} }
</style>
</head>
<body>
<header>
  <h1>AIGC Daily<span class="dot"> · </span>项目情报汇总</h1>
  <div class="sub">GitHub 新建 / 热门 / Trending · Hugging Face · arXiv ｜ 按日期 / 类别 / 来源 / 关键词筛选 · <a href="index.html">返回首页</a></div>
</header>
<div class="wrap">
  <div class="controls">
    <div class="group">
      <label class="lbl" for="f-date">日期</label>
      <select id="f-date"><option value="">全部日期</option></select>
    </div>
    <div class="group">
      <label class="lbl" for="f-sort">排序</label>
      <select id="f-sort">
        <option value="stars">按热度（★）</option>
        <option value="date">按日期（新→旧）</option>
      </select>
    </div>
    <div class="group">
      <label class="lbl" for="f-q">搜索</label>
      <input id="f-q" type="search" placeholder="名称 / 简介关键词…">
    </div>
    <div class="group" style="flex:1">
      <label class="lbl">来源</label>
      <div class="chips" id="f-source"></div>
    </div>
    <div class="group" style="flex:1">
      <label class="lbl">类别</label>
      <div class="chips" id="f-category"></div>
    </div>
  </div>
  <div class="bar">
    <span class="count" id="count">加载中…</span>
    <button class="reset" id="reset">重置筛选</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有符合条件的项目。</div>
</div>
<script>
const state = { date:"", q:"", sort:"stars", sources:new Set(), cats:new Set() };
let DATA = [];

function uniq(arr){ return [...new Set(arr)]; }
function chip(text, set, container){
  const el = document.createElement("span");
  el.className = "chip"; el.textContent = text;
  el.onclick = () => { if(set.has(text)) set.delete(text); else set.add(text);
    el.classList.toggle("on"); render(); };
  container.appendChild(el);
}
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render(){
  let rows = DATA.filter(r=>{
    if(state.date && r.date!==state.date) return false;
    if(state.sources.size && !state.sources.has(r.source)) return false;
    if(state.cats.size && !state.cats.has(r.category)) return false;
    if(state.q){ const q=state.q.toLowerCase();
      if(!((r.name||"").toLowerCase().includes(q) || (r.description||"").toLowerCase().includes(q)
          || (r.description_zh||"").toLowerCase().includes(q))) return false; }
    return true;
  });
  rows.sort((a,b)=> state.sort==="date"
    ? (b.date||"").localeCompare(a.date||"") || (b.stars-a.stars)
    : (b.stars-a.stars));
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("count").innerHTML = "<b>"+rows.length+"</b> 个项目";
  document.getElementById("empty").style.display = rows.length? "none":"block";
  for(const r of rows){
    const d = document.createElement("div"); d.className="item";
    const zh = (r.description_zh||"").trim();
    const en = (r.description||"").trim();
    const main = zh || en;
    const showEn = zh && en && en!==zh;
    d.innerHTML = `<h3><a href="${r.url}" target="_blank" rel="noopener">${esc(r.name)}</a></h3>
      <div class="meta">
        ${r.is_first_seen?'<span class="tag new">🆕 首次</span>':''}
        <span class="tag cat">${esc(r.category)}</span>
        <span class="tag">${esc(r.source)}</span>
        <span class="tag star">★ ${r.stars}</span>
        <span class="tag">${esc(r.date)}</span>
      </div>
      <div class="desc">${esc(main).slice(0,220)}${showEn?'<span class="en">'+esc(en).slice(0,180)+'</span>':''}</div>`;
    grid.appendChild(d);
  }
}

fetch("data/index.json").then(r=>r.json()).then(data=>{
  DATA = data;
  const dsel = document.getElementById("f-date");
  uniq(data.map(r=>r.date)).sort().reverse().forEach(d=>{
    const o=document.createElement("option"); o.value=d; o.textContent=d; dsel.appendChild(o);
  });
  uniq(data.map(r=>r.source)).sort().forEach(s=>chip(s, state.sources, document.getElementById("f-source")));
  uniq(data.map(r=>r.category)).sort().forEach(c=>chip(c, state.cats, document.getElementById("f-category")));
  dsel.onchange = e=>{ state.date=e.target.value; render(); };
  document.getElementById("f-sort").onchange = e=>{ state.sort=e.target.value; render(); };
  document.getElementById("f-q").oninput = e=>{ state.q=e.target.value; render(); };
  document.getElementById("reset").onclick = ()=>{
    state.date=""; state.q=""; state.sort="stars"; state.sources.clear(); state.cats.clear();
    dsel.value=""; document.getElementById("f-q").value=""; document.getElementById("f-sort").value="stars";
    document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on")); render();
  };
  render();
}).catch(e=>{ document.getElementById("count").textContent="数据加载失败："+e; });
</script>
</body>
</html>
